<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="balloon balloon-1"></div>
        <div class="balloon balloon-2"></div>
        <div class="balloon balloon-3"></div>
        <div class="balloon balloon-4"></div>
        <div class="balloon balloon-5"></div>

        <div class="content">
            <h1 class="title">🎉 Happy Birthday! 🎉</h1>
            <p class="subtitle">Wishing you a day filled with joy and celebration</p>
            
            <div class="cake">
                <div class="candle"></div>
                <div class="cake-layer"></div>
            </div>

            <button class="button" onclick="celebrateClick()">🎂 Make a Wish!</button>
            
            <div class="message">
                <p>May all your dreams come true and may this year bring you happiness, success, and wonderful memories!</p>
            </div>
        </div>

        <canvas id="confetti"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
